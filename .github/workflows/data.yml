name: data

on:
  schedule:
    - cron: "0 15 1 * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Read the whole listing instead of stopping after known pages"
        type: boolean
        default: false
      limit:
        description: "Process at most this many works (empty = no limit)"
        type: string
        default: ""
      from_scratch:
        description: "Ignore the snapshot release's database and build from empty"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: data
  cancel-in-progress: false

env:
  DB: dojinvoice.db
  ZIP: dojinvoice.db.zip
  TAG: v0.0.0

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Drop the tools mise.toml marks as local-only
        run: sed -i '/# \[skip ci\]/d' mise.toml
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: uv sync --locked --no-default-groups

      - name: Restore the database from the snapshot release
        if: ${{ !inputs.from_scratch }}
        run: |
          set -euo pipefail
          if gh release download "$TAG" --pattern "$ZIP" --dir . --clobber; then
            unzip -o "$ZIP"
            rm -f "$ZIP"
            echo "restored $DB from release $TAG"
          else
            echo "::notice::release $TAG carries no $ZIP yet; crawling into an empty database"
          fi

      - name: Crawl works published since the last snapshot
        env:
          FULL: ${{ inputs.full }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -uo pipefail
          args=(--db "$DB" --retry-errors)
          [ "${FULL:-}" = "true" ] && args+=(--full)
          if [ -n "${LIMIT:-}" ]; then
            case "$LIMIT" in
              *[!0-9]*) echo "::error::limit must be a number, got '$LIMIT'"; exit 2 ;;
              *) args+=(--limit "$LIMIT") ;;
            esac
          fi
          timeout --signal=INT --kill-after=2m 300m uv run dvdb crawl "${args[@]}" 2> crawl.log
          status=$?
          tail -n 20 crawl.log
          case "$status" in
            0) ;;
            124 | 130) echo "::warning::crawl stopped at the time limit (exit $status); publishing what it fetched" ;;
            *) exit "$status" ;;
          esac

      - name: Package the database
        run: |
          set -euo pipefail
          uv run python -c "
          import sqlite3, sys
          con = sqlite3.connect(sys.argv[1])
          con.execute('pragma wal_checkpoint(truncate)')
          con.execute('vacuum')
          con.close()
          " "$DB"
          uv run dvdb stats --db "$DB" | tee stats.txt
          zip -9 "$ZIP" "$DB"
          ls -lh "$ZIP"

      - name: Replace the database attached to the snapshot release
        run: |
          set -euo pipefail
          {
            echo "Database snapshot crawled on $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')."
            echo
            echo '```'
            cat stats.txt
            echo '```'
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            # --latest=false: this release is the database, not the newest package.
            gh release create "$TAG" "$ZIP" --title "$TAG" --notes-file notes.md --latest=false
          fi
