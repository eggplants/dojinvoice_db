[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling", "uv-dynamic-versioning" ]

[project]
name = "dojinvoice-db"
description = "Build and incrementally update a SQLite database of DLsite doujin voice works"
readme = "README.md"
keywords = [
  "asmr",
  "dlsite",
  "doujin",
  "sqlite",
]
license = { text = "MIT" }
authors = [ { name = "eggplants" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "dlsite-async>=0.10.2,<1",
]
urls.Repository = "https://github.com/eggplants/dojinvoice_db"
scripts.dvdb = "dojinvoice_db.cli:main"

[dependency-groups]
dev = [
  "pymarkdownlnt>=0.9.33",
  "pyproject-fmt>=2.11.1",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7",
]
docs = [
  "pdoc>=16",
]

[tool.hatch]
version.source = "uv-dynamic-versioning"
build.targets.wheel.packages = [ "dojinvoice_db" ]
build.targets.sdist.packages = [ "dojinvoice_db" ]

[tool.uv]
python-downloads = "never"
default-groups = [
  "dev",
  "docs",
]
exclude-newer = "P7D"
preview = true

[tool.ruff]
line-length = 120
format.indent-style = "space"
format.quote-style = "double"
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812",
  "D",
]
lint.per-file-ignores."dojinvoice_db/cli.py" = [
  "T201", # `print` found
]
lint.per-file-ignores."scripts/**" = [
  "CPY001", # Missing copyright notice
  "INP001", # Implicit namespace package (standalone dev scripts)
  "T201",   # `print` found
]
lint.per-file-ignores."tests/**" = [
  "ANN",     # Missing type annotations (tests/fixtures)
  "ARG",     # Unused arguments (pytest fixtures, lambda stubs)
  "CPY001",  # Missing copyright notice
  "DTZ",     # Naive datetimes (deterministic fixtures)
  "INP001",  # Implicit namespace package (no __init__ in tests)
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of assert detected
  "SLF001",  # Private member accessed
  "T201",    # `print` found
]
lint.pydocstyle.convention = "google"

[tool.pytest]
ini_options.asyncio_mode = "auto"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"
fallback-version = "0.0.0"
